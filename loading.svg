<svg xmlns="http://www.w3.org/2000/svg" width="270" height="28" viewBox="0 0 270 28" role="img" aria-label="loading profile animated dots">
  <rect width="270" height="28" fill="none"/>
  <g fill="#111111" font-family="Courier New, monospace" font-size="16">
    <text x="0" y="20">&gt; loading profile</text>
    <text x="173" y="20">.<animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.25;0.75;1" dur="2s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="183" y="20">.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.75;1" dur="2s" repeatCount="indefinite" calcMode="discrete"/></text>
    <text x="193" y="20">.<animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.75;1" dur="2s" repeatCount="indefinite" calcMode="discrete"/></text>
  </g>
</svg>
